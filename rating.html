<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RATING</title>
    <link rel="stylesheet"  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="rating.css">
</head>
<body>
<div class="rating-stars">
    <span  class="fa-solid fa-star star" onclick="setRating(1)"></span>
    <span  class="fa-solid fa-star star" onclick="setRating(2)"></span>
    <span  class="fa-solid fa-star star" onclick="setRating(3)"></span>
    <span  class="fa-solid fa-star star" onclick="setRating(4)"></span>
    <span  class="fa-solid fa-star star" onclick="setRating(5)"></span>
    <p id="msg">rating:0/5</p>  
    <script src="rating.js"></script>
</div>
</body>
</html>
